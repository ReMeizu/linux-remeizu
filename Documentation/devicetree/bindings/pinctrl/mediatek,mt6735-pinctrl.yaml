%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/mediatek,mt6735-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6735 and MT6735M pin controller

maintainers:
  - Sean Wang <sean.wang@kernel.org>

properties:
  compatible:
    enum:
      - mediatek,mt6735-pinctrl
      - mediatek,mt6735m-pinctrl

  reg:
    maxItems: 8

  reg-names:
    items:
      - const: gpio
      - const: iocfg0
      - const: iocfg1
      - const: iocfg2
      - const: iocfg3
      - const: iocfg4
      - const: iocfg5
      - const: eint

  gpio-controller: true
  '#gpio-cells':
    const: 2
  gpio-ranges:
    maxItems: 1
  interrupt-controller: true
  '#address-cells':
    const: 0
  '#interrupt-cells':
    const: 2
  interrupts:
    maxItems: 1

patternProperties:
  '-pins$':
    type: object
    additionalProperties: false
    patternProperties:
      '^pins':
        type: object
        $ref: pinmux-node.yaml#
        additionalProperties: false
        properties:
          pinmux: true
          bias-disable: true
          bias-pull-up: true
          bias-pull-down: true
          input-enable: true
          input-disable: true
          input-schmitt-enable: true
          input-schmitt-disable: true
          output-high: true
          output-low: true
        required:
          - pinmux

required:
  - compatible
  - reg
  - reg-names
  - gpio-controller
  - '#gpio-cells'
  - gpio-ranges
  - interrupt-controller
  - '#interrupt-cells'
  - interrupts

additionalProperties: false
