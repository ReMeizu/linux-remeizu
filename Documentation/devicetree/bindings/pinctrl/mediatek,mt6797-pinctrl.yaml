%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/mediatek,mt6797-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 Pin and External Interrupt Controller

maintainers:
  - forge <rap.player2006@gmail.com>

description: |
  MT6797 has 262 physical GPIOs and 192 external interrupt slots.
  The internal PMIC signal occupies EINT176 and has no physical GPIO
  register. Interrupt specifiers use EINT numbers, not the vendor BSP's
  translated GPIO numbers. The driver currently supports GPIO direction,
  level, function muxing and EINT; electrical pad controls need separate
  register descriptions.

properties:
  compatible:
    const: mediatek,mt6797-pinctrl

  reg:
    maxItems: 6

  reg-names:
    items:
      - const: gpio
      - const: iocfgl
      - const: iocfgb
      - const: iocfgr
      - const: iocfgt
      - const: eint

  gpio-controller: true

  "#gpio-cells":
    const: 2

  gpio-ranges:
    maxItems: 1

  interrupt-controller: true

  "#interrupt-cells":
    const: 2

  "#address-cells":
    const: 0

  interrupts:
    maxItems: 1

patternProperties:
  "-pins$":
    type: object
    additionalProperties: false
    patternProperties:
      "^pins":
        type: object
        additionalProperties: false
        properties:
          pinmux:
            $ref: /schemas/types.yaml#/definitions/uint32-array
        required:
          - pinmux

required:
  - compatible
  - reg
  - reg-names
  - gpio-controller
  - "#gpio-cells"
  - gpio-ranges
  - interrupt-controller
  - "#interrupt-cells"
  - interrupts

additionalProperties: false
