%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6797-mfgcfg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 mfgcfg (GFX) clock gate

description: |
  The mfgcfg block of the MT6797 SoC holds the gate of the GPU
  (Mali-T880MP4) core clock, MFG_BG3D. Its parent is the topckgen
  "mfg_sel" mux, fed by the apmixedsys MFGPLL and its dividers.

  The gate registers live at 0x13000000, inside the MFG_ASYNC MTCMOS
  domain, so the block is only reachable while that domain is powered.
  The provider is registered without runtime PM on purpose: the domain is
  brought up by the GPU consumer (panfrost, through its "mfg"
  power-domains entry) before it enables the GPU clock.

properties:
  compatible:
    const: mediatek,mt6797-mfgcfg

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@13000000 {
        compatible = "mediatek,mt6797-mfgcfg";
        reg = <0x13000000 0x1000>;
        #clock-cells = <1>;
    };
