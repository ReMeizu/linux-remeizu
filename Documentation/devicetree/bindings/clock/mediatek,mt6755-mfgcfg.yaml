%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6755-mfgcfg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6755/MT6750 mfgcfg (GFX) clock gate

maintainers:
  - Matthias Brugger <matthias.bgg@gmail.com>
  - AngeloGioacchino Del Regno <angelogioacchino.delregno@collabora.com>

description: |
  The mfgcfg block of the MT6755/MT6750 SoC holds the gate of the GPU
  (Mali-T860MP2) core clock, MFG_BG3D. Its parent is the topckgen "mfg_sel"
  mux, which is fed by either MPLL or one of the system/univ PLL dividers.

  The gate registers live at 0x13000000, inside the MFG_ASYNC MTCMOS
  domain, so the block is only reachable while that domain is powered.
  The provider is registered without runtime PM on purpose: the domain is
  brought up by the GPU consumer (panfrost, through its "mfg"
  power-domains entry) before it enables the GPU clock.

properties:
  compatible:
    const: mediatek,mt6755-mfgcfg

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  clocks:
    maxItems: 1
    description: Parent of the MFG_BG3D gate (topckgen "mfg_sel" mux).

  clock-names:
    const: mfg

  power-domains:
    maxItems: 1
    description:
      MFG_ASYNC MTCMOS domain. Optional; see the description for the
      ordering reason why the gate is normally registered without it.

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@13000000 {
        compatible = "mediatek,mt6755-mfgcfg";
        reg = <0x13000000 0x1000>;
        #clock-cells = <1>;
    };
