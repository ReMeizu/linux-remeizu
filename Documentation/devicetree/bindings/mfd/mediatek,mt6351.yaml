%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/mediatek,mt6351.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6351 PMIC

maintainers:
  - forge <rap.player2006@gmail.com>

description: |
  MT6351 is connected to the SoC PMIC wrapper. The interrupt controller
  has four banks of 16 interrupt slots. Storage regulator support covers
  VEMC, VMCH and VMC on E2/E3 revisions.

properties:
  compatible:
    const: mediatek,mt6351

  interrupts:
    maxItems: 1

  interrupt-controller: true

  "#interrupt-cells":
    const: 2

  "#address-cells":
    const: 0

  regulators:
    type: object
    $ref: /schemas/regulator/mediatek,mt6351-regulator.yaml
    unevaluatedProperties: false

required:
  - compatible
  - interrupts
  - interrupt-controller
  - "#interrupt-cells"
  - regulators

additionalProperties: false
