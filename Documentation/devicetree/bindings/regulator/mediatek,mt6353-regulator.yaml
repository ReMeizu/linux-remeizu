%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/mediatek,mt6353-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6353 Storage Regulators

maintainers:
  - forge <rap.player2006@gmail.com>

description: |
  VEMC, VMCH and VMC LDOs of the MT6353 PMIC. Register addresses and voltage
  tables come from the MediaTek 3.18 BSP: VEMC/VMCH select 2.9/3.0/3.3 V,
  VMC selects 1.2/1.3/1.5/1.8/2.5/2.9/3.0/3.3 V. The regulators node is a
  child of the MT6353 PMIC node; it is instantiated by the MT6397 MFD cell
  name, so no compatible is required.

patternProperties:
  "^ldo-v(emc|mch|mc)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false
    required:
      - regulator-name
      - regulator-min-microvolt
      - regulator-max-microvolt

additionalProperties: false
