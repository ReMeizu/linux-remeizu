%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/mediatek,mt6351-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6351 Storage Regulators

maintainers:
  - forge <rap.player2006@gmail.com>

description: |
  VEMC, VMCH and VMC LDOs of MT6351 E2/E3. Other MT6351 rails and E1
  voltage encodings require separate support. The regulators node is
  a child of the MT6351 PMIC.

patternProperties:
  "^ldo-v(emc|mch|mc)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false
    required:
      - regulator-name
      - regulator-min-microvolt
      - regulator-max-microvolt

additionalProperties: false
